<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Force Monitoring - Sales Dili (Cyberpunk Edition)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Rajdhani', 'Inter', sans-serif; 
            background-color: #05070f;
            color: #00f0ff;
        }
        
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        
        /* Cyberpunk Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #080c18; }
        ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 2px; box-shadow: 0 0 10px #00f0ff; }
        ::-webkit-scrollbar-thumb:hover { background: #ff007f; }

        /* Cyber Glow & HUD Styles */
        .cyber-border-cyan {
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        .cyber-border-pink {
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2), inset 0 0 10px rgba(255, 0, 127, 0.05);
        }
        .cyber-card {
            background: linear-gradient(135deg, rgba(13, 18, 33, 0.95) 0%, rgba(8, 11, 22, 0.98) 100%);
            backdrop-filter: blur(8px);
            position: relative;
        }
        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 6px;
            border-top: 2px solid #00f0ff;
            border-left: 2px solid #00f0ff;
        }
        .cyber-card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; width: 6px; height: 6px;
            border-bottom: 2px solid #ff007f;
            border-right: 2px solid #ff007f;
        }
        .text-glow-cyan { text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }
        .text-glow-pink { text-shadow: 0 0 8px rgba(255, 0, 127, 0.6); }
        .text-glow-yellow { text-shadow: 0 0 8px rgba(255, 230, 0, 0.6); }
        .text-glow-green { text-shadow: 0 0 8px rgba(0, 255, 157, 0.6); }
        
        .sticky-col { position: sticky; left: 0; z-index: 20; }
        .sticky-header { position: sticky; top: 0; z-index: 30; }
        
        /* Grid scanline background effect */
        .scanline-bg {
            background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="bg-[#05070f] text-slate-200 flex h-screen overflow-hidden scanline-bg">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-[#090d1a] border-r border-cyan-500/30 flex flex-col justify-between shrink-0 transition-all duration-300 z-30 shadow-[5px_0_25px_rgba(0,240,255,0.1)]">
        <div>
            <!-- Brand Logo Header -->
            <div class="p-5 border-b border-cyan-500/30 flex items-center space-x-3 bg-[#0c1224]">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-400 to-fuchsia-600 flex items-center justify-center font-black text-black text-xl font-cyber shadow-[0_0_15px_rgba(0,240,255,0.6)]">
                    S
                </div>
                <div>
                    <h1 class="font-black text-sm tracking-widest text-cyan-400 font-cyber text-glow-cyan">SALES DILI</h1>
                    <p class="text-[10px] text-fuchsia-400 font-bold uppercase tracking-wider">CYBER MONITOR v2.077</p>
                </div>
            </div>

            <!-- Simplified Navigation Menu -->
            <div class="p-4 space-y-2">
                <p class="text-[10px] uppercase tracking-widest text-cyan-500/70 font-cyber font-bold px-3 mb-2">:: SYSTEM MENUS ::</p>
                
                <!-- Dashboard Link -->
                <a href="#" id="menuDashboard" onclick="switchMenu('Dashboard', event)" class="flex items-center justify-between px-3.5 py-2.5 rounded border border-slate-800 text-xs font-semibold text-slate-400 hover:border-cyan-500/50 hover:text-cyan-300 hover:bg-cyan-500/10 transition group">
                    <span class="flex items-center space-x-3">
                        <i class="fa-solid fa-chart-pie text-cyan-400 group-hover:text-cyan-300 w-4 transition"></i>
                        <span class="font-cyber tracking-wider">DASHBOARD HUD</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-cyan-500/50 group-hover:text-cyan-300"></i>
                </a>

                <!-- Sales Force Link (Active) -->
                <a href="#" id="menuSalesForce" onclick="switchMenu('Sales Force', event)" class="flex items-center justify-between px-3.5 py-2.5 rounded text-xs font-bold bg-gradient-to-r from-cyan-500 to-blue-600 text-black border border-cyan-300 shadow-[0_0_15px_rgba(0,240,255,0.4)] transition">
                    <span class="flex items-center space-x-3">
                        <i class="fa-solid fa-users text-black w-4"></i>
                        <span class="font-cyber tracking-wider">SALES FORCE</span>
                    </span>
                    <span class="bg-black text-cyan-300 text-[10px] px-2 py-0.5 rounded font-cyber border border-cyan-400" id="badgeTotalSales">15</span>
                </a>
            </div>
        </div>

        <!-- Connection Status Indicator -->
        <div class="p-4 bg-[#070b16] border-t border-cyan-500/30 text-xs">
            <div class="flex items-center justify-between mb-1">
                <span class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping" id="statusDot"></span>
                    <span class="font-bold text-cyan-300 font-cyber text-[11px] tracking-wider" id="statusLabel">NET-LINK ACTIVE</span>
                </span>
            </div>
            <p class="text-fuchsia-400/80 text-[11px] font-mono truncate" title="Google Spreadsheet Terhubung" id="spreadsheetStatusText">&gt; G-SHEET SYNC OK</p>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#05070f] text-slate-200">
        
        <!-- TOP HEADER BAR -->
        <header class="bg-[#090d1a] border-b border-cyan-500/30 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 shrink-0 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
            
            <!-- Page Title & Subtitle -->
            <div class="flex items-center space-x-4">
                <div>
                    <h2 class="text-lg font-black text-cyan-400 font-cyber tracking-wider flex items-center space-x-2 text-glow-cyan" id="headerTitle">
                        <span>SALES FORCE MONITORING</span>
                    </h2>
                    <p class="text-xs text-fuchsia-400/80 font-mono mt-0.5" id="headerSubtitle">Real-time telemetry stream and sales performance matrices</p>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex flex-wrap items-center gap-3">
                
                <!-- Search Input Box -->
                <div class="relative" id="searchContainer">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-cyan-400">
                        <i class="fa-solid fa-terminal text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="QUERY SALES AGENT..." 
                        class="pl-9 pr-4 py-1.5 bg-[#0d1326] border border-cyan-500/40 rounded text-xs font-mono text-cyan-300 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 w-64 transition">
                </div>

                <!-- Refresh Data Button -->
                <button onclick="fetchSpreadsheetData()" class="bg-cyan-500 hover:bg-cyan-400 text-black px-4 py-1.5 rounded text-xs font-cyber font-bold flex items-center space-x
